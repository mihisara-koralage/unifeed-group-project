{% if form.non_field_errors %}<div class="field-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field-group">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-label="required">*</span>{% endif %}</label>
  {{ field }}
  {% if field.errors %}<div class="field-errors" id="{{ field.auto_id }}_errors" role="alert">{{ field.errors }}</div>{% endif %}
  {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_help">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
